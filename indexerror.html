<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTXOAGENT — Realms de Atomicals en Bitcoin</title>
<meta name="description" content="Colección de Realms de Atomicals sobre Bitcoin y agentes con nombre propio.">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+SC&family=Noto+Sans+KR&family=Noto+Sans+JP&family=Noto+Sans+TC&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&family=Noto+Sans+Math&family=Noto+Sans+Egyptian+Hieroglyphs&family=Noto+Sans+Cuneiform&family=Noto+Sans+Arabic&family=Noto+Sans+Hebrew&family=Noto+Sans+Thai&family=Noto+Sans+Tibetan&family=Noto+Sans+Devanagari&family=Noto+Sans+Bengali&family=Noto+Sans+Sinhala&family=Noto+Sans+Ethiopic&family=Noto+Sans+Tifinagh&family=Noto+Sans+Mongolian&family=Noto+Sans+Phoenician&family=Noto+Sans+Music&family=Noto+Sans+Mayan+Numerals&family=Noto+Sans+Tai+Viet&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--ink:#3c3c3c;--soft:#777;--line:#e5e5e5;
  --green:#58cc02;--green-d:#58a700;--blue:#1cb0f6;--blue-d:#1899d6;--pink:#ff3d9a;--pink-d:#d92a7e;
  --yellow:#ffc800;--yellow-d:#e5a900;--purple:#ce82ff;--purple-d:#a568cc;--orange:#ff9600;--orange-d:#d97e00;
  --font:'Nunito','Trebuchet MS',system-ui,sans-serif;
  --sym:'Nunito','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Noto Sans SC','Noto Sans KR','Noto Sans JP','Noto Sans TC','Noto Sans Symbols','Noto Sans Symbols 2','Noto Sans Math','Noto Sans Egyptian Hieroglyphs','Noto Sans Cuneiform','Noto Sans Arabic','Noto Sans Hebrew','Noto Sans Thai','Noto Sans Tibetan','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Sinhala','Noto Sans Ethiopic','Noto Sans Tifinagh','Noto Sans Mongolian','Noto Sans Phoenician','Noto Sans Music','Noto Sans Mayan Numerals','Noto Sans Tai Viet','Segoe UI Symbol',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:600;font-size:1.05rem;line-height:1.55;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-weight:900;line-height:1.05;margin:0;color:var(--ink)}
[hidden]{display:none!important}
nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 0;border-bottom:2px solid var(--line)}
.logo{font-weight:900;font-size:1.35rem;color:var(--green);text-decoration:none;letter-spacing:-.02em}
.btn{display:inline-block;font:900 1rem var(--font);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:#fff;background:var(--green);padding:14px 26px;border:0;border-radius:16px;border-bottom:5px solid var(--green-d);cursor:pointer;transition:transform .1s,border-bottom-width .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);border-bottom-width:1px}
.btn.blue{background:var(--blue);border-bottom-color:var(--blue-d)}
.btn.pink{background:var(--pink);border-bottom-color:var(--pink-d)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);border-bottom:5px solid var(--line)}
.btn.sm{padding:9px 16px;font-size:.85rem;border-bottom-width:4px}
a:focus-visible,summary:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.tabs{display:flex;gap:6px}.tabs a{font-weight:900;text-decoration:none;color:var(--soft);padding:8px 14px;border-radius:12px}
.tabs a.on{background:#ddf4ff;color:var(--blue-d);box-shadow:inset 0 0 0 2px var(--blue)}
.lang{font:900 .85rem var(--font);background:#fff;color:var(--soft);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:6px 10px;cursor:pointer}

/* HERO */
.hero{text-align:center;padding:12px 0 56px}
.stage{position:relative;height:450px;max-width:640px;margin:0 auto 26px}
.mascot{position:absolute;left:50%;top:50%;width:150px;margin:-85px 0 0 -75px;animation:bob 3s ease-in-out infinite;z-index:2}
.rc{position:absolute;left:var(--x);top:var(--y);font-family:var(--sym);font-weight:900;font-size:clamp(1.15rem,4.2vw,1.7rem);padding:8px 16px;border-radius:18px;color:var(--tc,#fff);background:var(--c);border-bottom:6px solid var(--cd);box-shadow:0 8px 20px -6px var(--c);white-space:nowrap;transform:rotate(var(--r));animation:float var(--t,5s) ease-in-out var(--d,0s) infinite;z-index:1}
.nosn{font-family:var(--font)!important}
.logos{display:flex;justify-content:center;align-items:flex-end;gap:34px;margin:6px 0 18px}
.lg{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:1rem;color:var(--ink)}
.lg svg,.lg img{width:64px;height:64px;display:block}
.lg .ph{width:64px;height:64px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--soft);font-size:1.6rem}
h1{font-size:clamp(2.1rem,7vw,3.6rem);letter-spacing:-.03em;max-width:15ch;margin:6px auto 0}
.hero p{max-width:40ch;margin:16px auto 26px;font-size:1.2rem;color:var(--soft)}
.cta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}

section{padding:60px 0;border-top:2px solid var(--line)}
.head{text-align:center;margin-bottom:34px}
.head h2{font-size:clamp(2rem,6vw,3rem);letter-spacing:-.02em}
.head p{max-width:50ch;margin:12px auto 0;color:var(--soft)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:22px;background:#fff}
.card .em{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.9rem;background:var(--c);border-bottom:4px solid var(--cd);margin-bottom:14px}
.card h3{font-size:1.35rem;margin-bottom:6px}.card p{margin:0;color:var(--soft)}
.path{display:grid;gap:26px;max-width:560px;margin:0 auto}
.step{display:flex;align-items:center;gap:18px}
.step:nth-child(even){flex-direction:row-reverse;text-align:right}
.node{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2rem;color:#fff;background:var(--c);border-bottom:7px solid var(--cd);animation:pulse 3s ease-in-out infinite}
.step:nth-child(2) .node{animation-delay:.4s}.step:nth-child(3) .node{animation-delay:.8s}.step:nth-child(4) .node{animation-delay:1.2s}
.step h3{font-size:1.3rem}.step p{margin:2px 0 0;color:var(--soft)}
.vocab{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.v{border:2px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.v b{flex:none;background:var(--c);color:#fff;border-radius:12px;padding:4px 12px;border-bottom:4px solid var(--cd);font-weight:900}
.v span{color:var(--soft)}
.faq{max-width:700px;margin:0 auto;display:grid;gap:12px}
details{border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:0 20px}
summary{cursor:pointer;font-weight:900;font-size:1.1rem;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--blue);font-size:1.5rem;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:0 0 16px;color:var(--soft)}
.final{background:var(--green);border-radius:30px;padding:46px 22px;text-align:center;border-bottom:8px solid var(--green-d);color:#fff}
.final h2{color:#fff;font-size:clamp(2rem,6vw,3rem)}
.final p{max-width:44ch;margin:12px auto 24px;color:#eaffd6}
.final .btn{background:#fff;color:var(--green-d);border-bottom-color:#d6d6d6}
footer{text-align:center;padding:34px 0 50px;color:var(--soft);font-size:.9rem}

/* COLLECTION */
.chead{text-align:center;padding:30px 0 10px}
.chead h1{font-size:clamp(2.4rem,9vw,4.4rem);max-width:none}.chead h1 b{color:var(--pink)}
.chead p{color:var(--soft);margin:8px 0 18px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);max-width:620px;margin:0 auto 22px}
.stat{border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:1.7rem;font-weight:900;color:var(--c);line-height:1.1;font-family:var(--sym)}
.stat span{font-size:.78rem;color:var(--soft);font-weight:800}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
#q,#sort{font:800 1.05rem var(--font);padding:12px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;color:var(--ink);background:#fff}
#q{flex:1 1 260px;max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 8px}
.chip{font:800 .85rem var(--font);border:2px solid var(--line);border-bottom-width:4px;background:#fff;color:var(--ink);padding:7px 13px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--c);border-color:var(--cd);color:#fff}
.cgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding:14px 0}
.tile{position:relative;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:30px 10px 12px;text-align:center;background:#fff;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;font-family:var(--font);color:var(--ink);transition:transform .1s}
.tile:hover{transform:translateY(-3px);border-color:var(--c)}
.tile:active{transform:translateY(2px)}
.tile .no{position:absolute;top:8px;left:10px;font-size:.75rem;font-weight:900;color:var(--soft)}
.tile .tag{position:absolute;top:7px;right:8px;font-size:.65rem;font-weight:900;color:#fff;background:var(--c);border-radius:99px;padding:2px 8px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .nm,.big{font-family:var(--sym);font-weight:700;line-height:1.15;word-break:break-all}
.tile .ds{font-size:.72rem;color:var(--soft);line-height:1.25;font-weight:700}
.tile .inf{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--soft);font:900 .8rem var(--font);display:grid;place-items:center}
.tile.pend{border-style:dashed}.tile.pend .nm{color:var(--pink)}
.more{text-align:center;margin:10px 0 20px}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);padding:40px 0}
.note{text-align:center;color:var(--soft);font-size:.9rem;margin-top:26px}
.sell{background:#ddf4ff;border-radius:24px;padding:26px 20px;text-align:center;margin:24px 0 0;border-bottom:6px solid #b7e4fa}
.sell h2{font-size:1.6rem}.sell p{margin:8px auto 16px;max-width:44ch;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;padding:10px 18px;border-radius:14px;z-index:30}
.ov{position:fixed;inset:0;background:rgba(40,40,40,.55);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:#fff;border-radius:26px;border-bottom:8px solid var(--cd,#d6d6d6);max-width:420px;width:100%;padding:26px 22px;text-align:center;max-height:90vh;overflow:auto}
.modal .big{font-size:4.2rem;min-height:5rem;display:flex;align-items:center;justify-content:center}
.modal .meta{font-weight:900;color:var(--c,var(--soft))}
.modal p{color:var(--soft);margin:8px 0}
.modal code{display:block;font:700 .8rem ui-monospace,Menlo,monospace;background:#f5f5f5;border-radius:10px;padding:8px;margin:10px 0 16px;word-break:break-all}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-14px) rotate(calc(var(--r) * -1))}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@media(max-width:560px){.step,.step:nth-child(even){flex-direction:row;text-align:left}.stage{height:480px}.tabs a{padding:6px 8px;font-size:.85rem}.logo{font-size:1.1rem}nav .btn.sm{display:none}.stat b{font-size:1.3rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
</style>
</head>

<div class="wrap">

  <div id="home">
